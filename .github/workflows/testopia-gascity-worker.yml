name: Testopia Gas City Copilot worker
on:
  workflow_dispatch:
    inputs:
      workspace_id: {required: true, type: string}
      action: {required: true, type: string}
      formula: {required: true, type: string}
      target_repo: {required: true, type: string}
      pr_number: {required: true, type: string}
      expected_head_sha: {required: true, type: string}
permissions:
  contents: read
concurrency:
  group: testopia-gascity-pr-3
  cancel-in-progress: false
jobs:
  execute:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: mickmister/gh-agentic-workflows/.github/workflows/testopia-gascity-worker.yml@4575031680336772611ea45ff5ce7d39f6f66bdf
    with:
      workspace_id: ${{ inputs.workspace_id }}
      action: ${{ inputs.action }}
      formula: ${{ inputs.formula }}
      target_repo: ${{ inputs.target_repo }}
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  publish:
    needs: execute
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Report result on Testopia PR #3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.execute.result }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = "mickmister/testopia"
          test "$PR_NUMBER" = "3"
          test "$WORKSPACE_ID" = "testopia-pr-3"
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.number' | grep -Fx "$PR_NUMBER"
          marker="<!-- testopia-gascity-run:$GITHUB_RUN_ID -->"
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '%s\n' "$marker" "### Gas City / Copilot execution" \
            "- Result: **$RESULT**" \
            "- Workspace: \`$WORKSPACE_ID\`" \
            "- PR head selected: \`$EXPECTED_SHA\`" \
            "- [Workflow run and evidence]($url)" \
            "" "This reports the worker result; it does not imply the Testopia CI failure is fixed.")"
          existing="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\")) | .id" | head -1)"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input - <<< "$payload"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - <<< "$payload"
          fi
