name: Testopia Gas City intent router
on:
  workflow_dispatch:
    inputs:
      request:
        description: Operator request for PR #3
        required: false
        type: string
        default: Investigate the failing browser CI using Gas City
  push:
    branches: [feat/mixed-runner-vertical-slice]
    paths: [.github/workflows/testopia-agent-router.yml]
permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write
  checks: read
jobs:
  route:
    uses: mickmister/gh-agentic-workflows/.github/workflows/testopia-router.lock.yml@2491bbd1c2a632f0644ca1c4b2463253b87acf5d
    with:
      request: ${{ inputs.request || 'Investigate the failing browser CI using Gas City' }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
